name: CI

# ════════════════════════════════════════════════════════════════════
# CI is the only reviewer that is present in every session.
#
# Three agents build this repository and none of them can see the
# others' work, so every rule they are asked to follow has to be
# checkable by a machine or it is decoration. That is what this file is
# for. In rough order of how expensive the mistake is to discover late:
#
#   frozen-paths  someone edited the shared contract unilaterally
#   static        the contract and its consumers have drifted apart
#   unit          shared pure logic (permissions, ranking, workflows)
#   database      migrations apply, and every tenant table has RLS
#   integration   the real enforcement path, against real Postgres
#   security      secrets committed, vulnerable deps, CodeQL
#
# Keep jobs independent so a failure names one thing. Do not collapse
# them into one script to save runner minutes; a red "build" job that
# could mean any of six problems is how agents end up guessing.
# ════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the previous run on the same branch, except on
# main where every commit's result is a record worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# The pnpm version is NOT declared here. pnpm/action-setup reads it from the
# `packageManager` field in package.json, which is also what a developer's
# corepack uses — so there is exactly one place to change it. Declaring it in
# both is how CI ends up installing a different pnpm than anyone runs locally.
#
# actions/setup-node is held at v5 deliberately: v6 removed automatic caching
# for everything except npm, and `cache: pnpm` below is what keeps install at
# ~5s instead of ~40s. Moving past v5 means replacing it with an explicit
# actions/cache step keyed on pnpm-lock.yaml, not just bumping the number.
env:
  NODE_VERSION: '22'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Ownership. Runs first and fastest: if a PR has edited the treaty,
  # nothing else about it matters yet.
  # ──────────────────────────────────────────────────────────────────
  frozen-paths:
    name: Frozen paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Needs history on both sides to find the merge base.
          fetch-depth: 0

      - name: Check ownership
        env:
          BASE_REF: origin/${{ github.base_ref }}
          # The escape hatch, deliberately narrow: architecture branches
          # and PRs a human has labelled. An agent cannot grant itself
          # either one.
          FROZEN_PATHS_OVERRIDE: ${{ (startsWith(github.head_ref, 'arch/') || contains(github.event.pull_request.labels.*.name, 'architecture')) && '1' || '0' }}
        run: |
          # fetch-depth: 0 above already has the history, but on a PR the
          # base branch is not guaranteed to exist as a local remote-tracking
          # ref, and the script needs one to find the merge base.
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/check-frozen-paths.mjs "origin/${{ github.base_ref }}"

  # ──────────────────────────────────────────────────────────────────
  # Types and lint. This is the job that catches an API and a UI built
  # against different versions of the same contract.
  # ──────────────────────────────────────────────────────────────────
  static:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, because it explains failures in every step below it. apps/web was
      # on vitest 4 and the three packages/* were on vitest 2; both installed and
      # both were green, until a checkout in a different directory made pnpm hoist
      # the other major into node_modules/.pnpm/node_modules/. @testing-library
      # /jest-dom declares no vitest at all, so that fallback is what its
      # `expect.extend()` found — registering every matcher onto a chai instance
      # no assertion touched. 121 tests failed with "Invalid Chai property:
      # toHaveAttribute" and 6 with TS2339, all of which read as a missing setup
      # file. Which major wins the hoist is not pinned by the lockfile, so the
      # same commit was green in one working tree and red in another.
      - name: Audit toolchain versions
        run: pnpm check:toolchain

      # Contracts must be built first: everything else consumes its
      # emitted .d.ts, and declaration emit fails on whole classes of
      # error that `tsc --noEmit` cannot see (TS4023 on unnameable
      # types, most memorably).
      - name: Build contracts
        run: pnpm --filter @flux/contracts build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # There was no .prettierrc for the first sixteen migrations, which meant
      # `pnpm format` used prettier's defaults — double quotes and semicolons,
      # the opposite of every file in the repo. The first agent to run it would
      # have rewritten the entire codebase and buried its own diff. The config
      # now matches the code, and this step is what keeps that true.
      - name: Formatting
        run: pnpm format:check

      # No database needed, so it runs here rather than in `database`.
      # ErrorCodeSchema is a closed enum because clients switch on it, which
      # means a spec naming a code the enum lacks describes something the
      # build agent cannot write — so it invents a code, and the UI switches
      # on one that never arrives. The specs named 45 such codes before this
      # check existed, most of them near-misses of a code that was already
      # there (`invalid_field_value` for `field_value_invalid`).
      - name: Audit documented error codes
        run: pnpm check:errors

      # The same drift, one vocabulary over, and with a worse failure mode:
      # event_outbox.event_type has no CHECK (deliberately — adding a type must
      # not need a migration), so an undeclared type is written, the transaction
      # COMMITS, the request returns 201, and only then does the relay fail to
      # parse it. The event is durably stored and permanently undeliverable: no
      # index, no notification, no webhook, and no error anyone saw. All seven
      # specs with an Events section named at least one such type.
      - name: Audit documented event types
        run: pnpm check:events

      # The specs cross-reference each other by section number, and inserting a
      # section renumbers every one after it. A stale §N still renders as a
      # working link and now points at the wrong section, so a build agent
      # follows it and implements the wrong thing with nothing to warn it. Two of
      # these existed within one editing session, which is what made it a check
      # rather than a habit.
      - name: Audit doc links and section references
        run: pnpm check:docs

      # `typecheck` cannot catch this by construction: it names its configs by
      # hand, so it is green whether or not the editor sees the same program. A
      # language server discovers a project only through a file *named*
      # tsconfig.json, and all three packages once excluded their tests from it —
      # which showed 117 errors that did not exist in apps/web and, worse,
      # nothing at all in contracts and mocks, where the tests were quietly
      # checked without `strict`. This also asserts that a `types: []` config
      # still excludes the tests: one that includes them is a no-op that passes,
      # because a test importing vitest pulls @types/node into the whole program.
      - name: Audit tsconfig coverage and the no-ambient-types guarantee
        run: pnpm check:tsconfigs

      # The sixth kind of drift, and the only one whose cost lands outside the
      # contracts entirely. BoardCardSchema.priority was `z.string()` while every
      # other priority was PrioritySchema: it compiled, it matched its column, and
      # its CHECK holds the same six values — so check:columns and check:enums
      # were both green. The bill arrived in a component, where the cast that the
      # loose type forced let an unmapped value reach a map lookup and one card
      # blanked the whole board through the error boundary. This holds 32 field
      # names to one schema each and rejects an inline z.enum that copies a
      # declared one; the exception list is itself checked for staleness.
      - name: Audit field vocabularies
        run: pnpm check:vocab

      # The same shape as the step below, one asset type over. `apps/web/public/`
      # held msw's generated service worker, and Vite copies publicDir verbatim —
      # so every production build shipped `dist/mockServiceWorker.js`, a
      # same-origin service worker any script on the page can register, after
      # which it answers every request from a mock handler list. The module was
      # correctly tree-shaken and verified absent; tree-shaking is a property of
      # imports and a static asset has none, so the mechanism everyone trusted was
      # silent rather than wrong about the one file that mattered.
      - name: Audit publicDir assets
        run: pnpm check:public

      # The one kind of drift that hides a change rather than causing one.
      # `keyboard/registry.ts` joined two Map-key halves with a NUL typed as a
      # raw byte instead of the `\u0000` escape. git calls a blob binary if it
      # finds a NUL in the first 8000 bytes; this one was at 6891, so a 76-line
      # edit to a reviewed module reported as "Bin 14293 -> 16354 bytes" in
      # `git diff`, in `git blame`, and in every review view on GitHub. format,
      # lint, typecheck and 1019 tests were all green on exactly that content:
      # a NUL is valid UTF-8 and valid TypeScript inside a string literal, so
      # nothing in the toolchain has an opinion. Two other files carry the same
      # byte past that 8000-byte window and have diffed normally for months —
      # same defect, opposite outcome, decided only by how much text sits above
      # it, and one new header away from flipping. Rule C is the adjacent
      # hazard: bidi overrides reorder how a line displays without changing
      # what the compiler reads (CVE-2021-42574).
      - name: Assert every tracked file is reviewable text
        run: pnpm check:text

      # dist/ is gitignored, so a test file leaking into the published
      # build is invisible locally and permanent once shipped.
      - name: Assert no test files in build output
        run: |
          leaked=$(find packages/*/dist -name '*.test.*' 2>/dev/null || true)
          if [ -n "$leaked" ]; then
            echo "Test files were emitted into dist/:"
            echo "$leaked"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────
  # Pure logic. No database, no network — these are the functions that
  # must give the same answer on the client and the server.
  # ──────────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flux/contracts build
      - run: pnpm test

  # ──────────────────────────────────────────────────────────────────
  # Migrations and tenant isolation.
  #
  # check:rls is the highest-value job in this file. A tenant table
  # that ships without a policy is not a bug that surfaces as an error
  # — it is a silent cross-tenant data leak that looks like working
  # software. So RLS is asserted structurally on every commit rather
  # than trusted to review.
  # ──────────────────────────────────────────────────────────────────
  database:
    name: Migrations & RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flux
          POSTGRES_USER: flux_migrator
          POSTGRES_PASSWORD: flux_migrator_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flux_migrator -d flux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_MIGRATOR_URL: postgres://flux_migrator:flux_migrator_dev@localhost:5432/flux
      DATABASE_URL: postgres://flux_app:flux_app_dev@localhost:5432/flux
      PGPASSWORD: flux_migrator_dev

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flux/contracts build

      # docker-compose mounts db/bootstrap into the entrypoint; a
      # service container cannot, so apply it by hand. It must run as
      # flux_migrator, because ALTER DEFAULT PRIVILEGES only affects
      # objects created by the role that ran it — and flux_migrator is
      # what creates every table.
      - name: Bootstrap roles
        run: |
          for f in db/bootstrap/*.sql; do
            echo "── $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U flux_migrator -d flux -f "$f"
          done

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Migrations are idempotent
        run: pnpm db:migrate

      # Fails on anything pending, and on any applied migration whose
      # file no longer hashes to what was recorded — an edited migration
      # silently diverges every environment that ran the old version.
      - name: Schema is up to date
        run: pnpm db:check

      - name: Audit tenant isolation
        run: pnpm check:rls

      # Compares every contract z.enum against the CHECK constraint behind
      # it. Migration 0011 fixed ~25 of these divergences and not one was
      # visible to tsc, to a unit test, or to review: a value the type
      # system accepts and the database rejects fails at INSERT, and a
      # value the database holds and zod rejects makes the row unreadable
      # through the API. The contracts are a treaty between agents who
      # cannot talk to each other, and a treaty nothing verifies is a
      # comment.
      - name: Audit contract/schema enum drift
        run: pnpm check:enums

      # The same idea one level up: does every contract field have a column,
      # and does every column have a purpose someone wrote down. Fifteen of
      # the twenty-seven entity schemas disagreed with their table about a
      # field name before 0012, and a name mismatch has three plausible
      # "fixes" — rename the column, rename the field, or hide a mapping in a
      # service. Two agents working in parallel would not pick the same one.
      - name: Audit contract/schema field drift
        run: pnpm check:columns

      - name: Integration tests
        run: pnpm test:integration

  # ──────────────────────────────────────────────────────────────────
  # Security. Cheap, and the failures it catches are the expensive kind.
  # ──────────────────────────────────────────────────────────────────
  security:
    name: Secrets & dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A committed .env is the single most common way a project of this
      # shape leaks production credentials.
      - name: No committed .env
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env is tracked by git. Remove it: git rm --cached .env"
            exit 1
          fi

      # Two rules in one script. .env.example is documentation and gets
      # copied verbatim, so a real value in it is a real leak and every
      # KEY=VALUE there must be a placeholder or a `_dev` credential. The
      # second rule is live-credential *shapes* — AWS keys, tokens, PEM
      # blocks, a password in a DSN — anywhere in a tracked file, which is
      # what this step actually spends its time on.
      #
      # `pnpm check:secrets`, not `node scripts/check-secrets.mjs`. The script had
      # no pnpm name for months, so it was the one check nobody could run locally —
      # and a branch reached this job with eight findings in it, none of which any
      # local gate could have shown. Every other check in this file is invoked by
      # the same name a person types.
      - name: No committed credentials
        run: pnpm check:secrets

      - name: Vulnerable dependencies
        run: pnpm audit --audit-level high --prod

  # ──────────────────────────────────────────────────────────────────
  # CodeQL.
  #
  # Code scanning is free on public repositories and part of GitHub Code
  # Security — a paid add-on — on private ones. **This repository is now
  # public, so CodeQL runs.** The probe below is kept rather than deleted,
  # for two reasons that outlive the change.
  #
  # The first is the history. While the repository was private, `analyze`
  # spent three minutes building a database and then failed with "Resource
  # not accessible by integration" — a red job that no change to this
  # repository could turn green. A permanently red job is worse than an
  # absent one: people stop reading a status they know is always red, and
  # the next genuine failure arrives inside that noise. But silently
  # skipping is worse still — that is the blind-spot shape described in
  # CLAUDE.md, where a green tick means "not analysed" and reads as
  # "analysed, clean". So the job asks first, and when the answer is no it
  # says so in the run summary and as a workflow warning.
  #
  # The second is that visibility is a setting, not a property of the code.
  # Anyone can flip this repository back to private in two clicks, and the
  # failure mode that returns is the silent one: the analysis stops and
  # nothing about the code changed to say so. The probe is what makes that
  # loud instead. It reads `github.event.repository.private` at run time
  # rather than trusting this comment, which is the only reason the switch
  # to public needed no edit here to start working.
  # ──────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Is code scanning available
        id: probe
        run: |
          # Fails safe: an absent `private` field renders as an empty string,
          # which is not "false", so the job warns rather than erroring.
          if [ "${{ github.event.repository.private }}" = "false" ] \
             || [ "${{ vars.CODE_SCANNING_ENABLED }}" = "1" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'run=false' >> "$GITHUB_OUTPUT"
          {
            echo '### CodeQL did not run'
            echo
            echo 'Static analysis is **not** covering this commit.'
            echo
            echo 'Code scanning is free on public repositories and part of GitHub'
            echo 'Code Security (paid) on private ones. This repository is **not'
            echo 'public** and the repository variable `CODE_SCANNING_ENABLED` is'
            echo 'not `1`.'
            echo
            echo 'This repository *was* public, and CodeQL ran. If you are reading'
            echo 'this, its visibility changed and static analysis stopped — which'
            echo 'is a decision, not a bug, but it should be a deliberate one.'
            echo
            echo 'To restore coverage: make the repository public again, or turn on'
            echo 'Code Security for it and set `CODE_SCANNING_ENABLED=1` as a'
            echo 'repository variable. Until then this job is a placeholder and'
            echo 'every run will say so here.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=CodeQL skipped::This repository is no longer public and code scanning is not enabled — this commit was not statically analysed. See the run summary."

      - uses: actions/checkout@v5
        if: steps.probe.outputs.run == 'true'
      - uses: github/codeql-action/init@v4
        if: steps.probe.outputs.run == 'true'
        with:
          languages: javascript-typescript
          queries: security-extended
          # One exclusion, for msw's generated service worker. The file says not
          # to modify it and it no longer ships; the config explains both, and why
          # it is a version-controlled exclusion rather than a UI dismissal.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        if: steps.probe.outputs.run == 'true'
