name: 'flux'

# ════════════════════════════════════════════════════════════════════
# Query packs live in the workflow (`queries: security-extended` in the
# init step), not here, so there is one place to read what is run. This
# file exists only to say what is deliberately not analysed, and why.
#
# The list is meant to stay at one entry. An exclusion is a promise that
# nobody will look at that path again, so each one has to be worth it in
# writing.
# ════════════════════════════════════════════════════════════════════

paths-ignore:
  # Generated by `msw init`, committed on purpose, and headed
  # "Please do NOT modify this file". CodeQL flagged its `message` handler for
  # acting on postMessage data without checking the origin
  # (js/missing-origin-check) on its first run against this repository, and the
  # finding is true as written — but nothing here can act on it. The fix belongs
  # upstream in msw, and editing a generated file would be reverted by the next
  # `msw init`.
  #
  # It is excluded rather than dismissed in the UI because a dismissal is a click
  # nobody reviewing this repository can see. The exclusion is narrow on purpose:
  # this exact path, not `apps/web/public/**` and not `**/*ServiceWorker.js`, so a
  # second file appearing beside it is still analysed.
  #
  # What makes the exclusion defensible is that the file no longer reaches
  # production: `apps/web/vite.config.ts` sets `copyPublicDir: false` and
  # `scripts/check-public-assets.mjs` fails if a dev-only artifact turns up in a
  # build. If that ever stops being true, this entry is hiding a real finding
  # about a real production asset — so the two are a pair, and neither should be
  # removed without the other.
  - apps/web/public/mockServiceWorker.js
